---
# =============================================================================
# redis_stack | validate
# =============================================================================
# Read-only. Asserts Redis answers PING with the stored credentials and has the
# RediSearch module loaded.
# =============================================================================

- name: "redis_stack | validate | Read Redis pods"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ redis_stack_namespace }}"
    label_selectors:
      - app=redis-stack-server
    field_selectors:
      - status.phase=Running
  register: _redis_stack_pods
  check_mode: false

- name: "redis_stack | validate | Assert a Redis pod is running"
  ansible.builtin.assert:
    that: _redis_stack_pods.resources | length > 0
    fail_msg: "No running redis-stack-server pod in namespace {{ redis_stack_namespace }}"
    quiet: true

# The chart creates the Secret only when auth is enabled.
- name: "redis_stack | validate | Read credentials"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: redis-stack-server-credentials
    namespace: "{{ redis_stack_namespace }}"
  register: _redis_stack_secret
  check_mode: false
  no_log: "{{ secure_logs | default(true) | bool }}"

- name: "redis_stack | validate | Query Redis"
  kubernetes.core.k8s_exec:
    namespace: "{{ redis_stack_namespace }}"
    pod: "{{ _redis_stack_pods.resources[0].metadata.name }}"
    command: "redis-cli {{ _redis_stack_auth_args }}{{ item }}"
  vars:
    _redis_stack_password: >-
      {{ _redis_stack_secret.resources[0].data.REDIS_PASSWORD | default('') | b64decode
         if _redis_stack_secret.resources | length > 0 else '' }}
    _redis_stack_auth_args: >-
      {{ ('-a ' ~ (_redis_stack_password | trim | quote) ~ ' --no-auth-warning ')
         if _redis_stack_password | trim | length > 0 else '' }}
  loop: [PING, MODULE LIST]
  register: _redis_stack_queries
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: "{{ secure_logs | default(true) | bool }}"

- name: "redis_stack | validate | Assert Redis answered PING"
  ansible.builtin.assert:
    that: "'PONG' in _redis_stack_queries.results[0].stdout | default('')"
    fail_msg: >-
      Redis PING failed:
      {{ (_redis_stack_queries.results[0].stderr | default('') ~ ' '
          ~ _redis_stack_queries.results[0].msg | default('')) | trim }}
    quiet: true

- name: "redis_stack | validate | Assert RediSearch module is loaded"
  ansible.builtin.assert:
    that: "'search' in _redis_stack_queries.results[1].stdout | default('')"
    fail_msg: >-
      RediSearch module not loaded:
      {{ (_redis_stack_queries.results[1].stderr | default('') ~ ' '
          ~ _redis_stack_queries.results[1].msg | default('')) | trim }}
    quiet: true
