# =============================================================================
# redis_stack | teardown
# =============================================================================
# Removes the Helm release. The namespace holds the data PVC, so it is deleted
# only with redis_stack_teardown_delete_pvcs. A no-op when nothing is present.
# =============================================================================

- name: "redis_stack | teardown | Remove Helm release"
  kubernetes.core.helm:
    name: "{{ redis_stack_release_name }}"
    release_namespace: "{{ redis_stack_namespace }}"
    state: absent
    wait: "{{ helm_wait }}"
    timeout: "{{ helm_timeout }}"

- name: "redis_stack | teardown | Remove namespace and data volumes"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ redis_stack_namespace }}"
    wait: true
  when: redis_stack_teardown_delete_pvcs | bool
