---
# =============================================================================
# kuberay | install
# =============================================================================
# Installs or upgrades the KubeRay operator and the RayCluster release, then
# waits for the Ray head pod.
# =============================================================================

- name: "kuberay | install | Create namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ kuberay_namespace }}"

- name: "kuberay | install | Add Helm repository"
  kubernetes.core.helm_repository:
    name: kuberay
    repo_url: "{{ kuberay_helm_repo }}"

- name: "kuberay | install | Install operator"
  kubernetes.core.helm:
    name: "{{ kuberay_operator_release_name }}"
    chart_ref: kuberay/kuberay-operator
    chart_version: "{{ kuberay_operator_version }}"
    release_namespace: "{{ kuberay_namespace }}"
    wait: "{{ helm_wait }}"
    timeout: "{{ helm_timeout }}"
  register: _kuberay_operator_helm
  retries: "{{ helm_retries }}"
  delay: 15
  until: _kuberay_operator_helm is succeeded

- name: "kuberay | install | Install RayCluster"
  kubernetes.core.helm:
    name: "{{ kuberay_release_name }}"
    chart_ref: "{{ kuberay_chart_path }}"
    release_namespace: "{{ kuberay_namespace }}"
    wait: "{{ helm_wait }}"
    timeout: "{{ helm_timeout }}"
    values:
      cluster:
        name: "{{ kuberay_release_name }}"
        rayImage: "{{ kuberay_ray_image }}"
        head:
          cpuRequest: "{{ kuberay_head_cpu_request }}"
          cpuLimit: "{{ kuberay_head_cpu_limit }}"
          memoryRequest: "{{ kuberay_head_memory_request }}"
          memoryLimit: "{{ kuberay_head_memory_limit }}"
        worker:
          replicas: "{{ kuberay_worker_replicas }}"
          minReplicas: "{{ kuberay_worker_min_replicas }}"
          maxReplicas: "{{ kuberay_worker_max_replicas }}"
          cpuRequest: "{{ kuberay_worker_cpu_request }}"
          cpuLimit: "{{ kuberay_worker_cpu_limit }}"
          memoryRequest: "{{ kuberay_worker_memory_request }}"
          memoryLimit: "{{ kuberay_worker_memory_limit }}"
  register: _kuberay_cluster_helm
  retries: "{{ helm_retries }}"
  delay: 15
  until: _kuberay_cluster_helm is succeeded

- name: "kuberay | install | Wait for Ray head pod"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ kuberay_namespace }}"
    label_selectors:
      - ray.io/node-type=head
      - "ray.io/cluster={{ kuberay_release_name }}"
  register: _kuberay_head
  until:
    - _kuberay_head.resources | length > 0
    - _kuberay_head.resources | selectattr('status.phase', 'eq', 'Running') | list | length > 0
  retries: 60
  delay: 5
  check_mode: false

- name: "kuberay | install | Show connection details"
  ansible.builtin.debug:
    msg:
      - "Ray Client: ray://{{ kuberay_release_name }}-head-svc.{{ kuberay_namespace }}.svc.cluster.local:10001"
      - "Dashboard: http://{{ kuberay_release_name }}-head-svc.{{ kuberay_namespace }}.svc.cluster.local:8265"
