---
# =============================================================================
# kuberay | action dispatcher
# =============================================================================
# Runs tasks/<component_action>.yaml. Supported: install, teardown, validate.
# =============================================================================

- name: "kuberay | dispatch | Assert supported action"
  ansible.builtin.assert:
    that: component_action in ['install', 'teardown', 'validate']
    fail_msg: "kuberay: unsupported component_action='{{ component_action | default('') }}'"
    quiet: true

- name: "kuberay | dispatch | Include {{ component_action }}"
  ansible.builtin.include_tasks: "{{ component_action }}.yaml"
