---
# =============================================================================
# kuberay | teardown
# =============================================================================
# Removes the RayCluster release, then the operator release and the namespace.
# The operator's CRDs stay (Helm never deletes CRDs). A no-op when nothing is
# present.
# =============================================================================

- name: "kuberay | teardown | Remove Helm releases"
  kubernetes.core.helm:
    name: "{{ item }}"
    release_namespace: "{{ kuberay_namespace }}"
    state: absent
    wait: "{{ helm_wait }}"
    timeout: "{{ helm_timeout }}"
  loop:
    - "{{ kuberay_release_name }}"
    - "{{ kuberay_operator_release_name }}"

- name: "kuberay | teardown | Remove namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ kuberay_namespace }}"
    wait: true
