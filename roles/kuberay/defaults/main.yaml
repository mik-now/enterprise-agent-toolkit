---
# =============================================================================
# kuberay | defaults
# =============================================================================
# KubeRay operator + a RayCluster: distributed compute for parallel tool
# execution in agentic workloads.
#
# In-cluster addresses after deployment:
#   Ray Client API : ray://<kuberay_release_name>-head-svc.<kuberay_namespace>.svc.cluster.local:10001
#   Dashboard      : http://<kuberay_release_name>-head-svc.<kuberay_namespace>.svc.cluster.local:8265
# =============================================================================

# ── Version / source ──────────────────────────────────────────────────────────
kuberay_operator_version: "1.3.0"                              # kuberay-operator chart version
kuberay_helm_repo: "https://ray-project.github.io/kuberay-helm/"  # operator chart repository
kuberay_operator_release_name: "kuberay-operator"              # operator Helm release name
kuberay_chart_path: "{{ role_path }}/../../charts/kuberay"   # vendored RayCluster chart
kuberay_release_name: "ray-cluster"                            # RayCluster Helm release (and cluster) name
kuberay_ray_image: "rayproject/ray:2.40.0-py312"               # Ray head and worker image

# ── Placement ─────────────────────────────────────────────────────────────────
kuberay_namespace: "ray-system"  # created by install

# ── Behaviour ─────────────────────────────────────────────────────────────────
kuberay_worker_replicas: 2           # initial worker count
kuberay_worker_min_replicas: 1       # autoscaler lower bound
kuberay_worker_max_replicas: 4       # autoscaler upper bound
kuberay_worker_cpu_request: "500m"   # per worker
kuberay_worker_cpu_limit: "2"        # per worker
kuberay_worker_memory_request: "2Gi" # per worker
kuberay_worker_memory_limit: "4Gi"   # per worker
kuberay_head_cpu_request: "500m"     # head pod
kuberay_head_cpu_limit: "2"          # head pod
kuberay_head_memory_request: "2Gi"   # head pod
kuberay_head_memory_limit: "4Gi"     # head pod
