---
# =============================================================================
# pgvector | defaults
# =============================================================================
# PostgreSQL + the pgvector extension: long-term memory, vector embeddings and
# RAG state for agentic workloads.
#
# In-cluster address after deployment:
#   pgvector.<pgvector_namespace>.svc.cluster.local:5432
# Credentials: Secret pgvector-credentials (DATABASE_URL, host, port, ...)
# =============================================================================

# ── Version / source ──────────────────────────────────────────────────────────
pgvector_version: "16"                                          # PostgreSQL major (image pgvector/pgvector:pg<version>)
pgvector_chart_path: "{{ role_path }}/../../charts/pgvector"  # vendored chart
pgvector_release_name: "pgvector"                               # Helm release name

# ── Placement ─────────────────────────────────────────────────────────────────
pgvector_namespace: "pgvector"  # created by install

# ── Behaviour ─────────────────────────────────────────────────────────────────
pgvector_database: "agentdb"    # database created on first start
pgvector_username: "agentuser"  # database owner
pgvector_storage_size: "20Gi"   # PVC size of the data volume
pgvector_storage_class: ""      # empty = cluster default StorageClass (ai-solutions storage)
# Used on first install only; later runs keep the password stored in Secret pgvector-auth.
pgvector_password: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"
# Pod resources: requests/limits dict, passed to the chart as is.
pgvector_resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "2Gi"
pgvector_teardown_delete_pvcs: false  # true = teardown also deletes the namespace, data PVC and password
