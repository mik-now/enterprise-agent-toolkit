---
# =============================================================================
# pgvector | teardown
# =============================================================================
# Removes the Helm release (and with it Secret pgvector-credentials). The
# namespace holds the data PVC and Secret pgvector-auth, so it is deleted only
# with pgvector_teardown_delete_pvcs. A no-op when nothing is present.
# =============================================================================

- name: "pgvector | teardown | Remove Helm release"
  kubernetes.core.helm:
    name: "{{ pgvector_release_name }}"
    release_namespace: "{{ pgvector_namespace }}"
    state: absent
    wait: "{{ helm_wait }}"
    timeout: "{{ helm_timeout }}"

- name: "pgvector | teardown | Remove namespace, data volume and password"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ pgvector_namespace }}"
    wait: true
  when: pgvector_teardown_delete_pvcs | bool
