---
# =============================================================================
# agent_sandbox | install
# =============================================================================
# Applies the upstream release manifests (CRDs + controller, extensions,
# sandbox-router), the default python SandboxTemplate + warm pool and, when
# kata_containers created a Kata RuntimeClass, the Kata template + warm pool.
# Every run re-applies them, so a version bump takes effect.
# =============================================================================

# ── Controller ────────────────────────────────────────────────────────────────

- name: "agent_sandbox | install | Create namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ agent_sandbox_namespace }}"

- name: "agent_sandbox | install | Apply release manifests"
  kubernetes.core.k8s:
    state: present
    src: "{{ item }}"
  loop:
    - "{{ agent_sandbox_core_manifest_url }}"
    - "{{ agent_sandbox_extensions_manifest_url }}"

- name: "agent_sandbox | install | Wait for controller"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: agent-sandbox-controller
    namespace: "{{ agent_sandbox_namespace }}"
    wait: true
    wait_timeout: 600
  check_mode: false

# ── Sandbox router ────────────────────────────────────────────────────────────

- name: "agent_sandbox | install | Read sandbox-router auth token"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: sandbox-router-auth
    namespace: "{{ agent_sandbox_namespace }}"
  register: _agent_sandbox_router_secret
  check_mode: false
  no_log: "{{ secure_logs | default(true) | bool }}"

# Created once: a new token on every run would break connected clients.
- name: "agent_sandbox | install | Create sandbox-router auth token"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: sandbox-router-auth
        namespace: "{{ agent_sandbox_namespace }}"
      type: Opaque
      stringData:
        ROUTER_AUTH_TOKEN: "{{ lookup('ansible.builtin.password', '/dev/null length=64 chars=hexdigits') }}"
  no_log: "{{ secure_logs | default(true) | bool }}"
  when: _agent_sandbox_router_secret.resources | length == 0

# raw.githubusercontent.com throttles (HTTP 429), hence the retries.
- name: "agent_sandbox | install | Download sandbox-router manifest"
  ansible.builtin.uri:
    url: "{{ agent_sandbox_router_manifest_url }}"
    return_content: true
  register: _agent_sandbox_router_manifest
  retries: 5
  delay: 30
  until: _agent_sandbox_router_manifest is succeeded
  check_mode: false

# The upstream manifest expects a locally built image: substitute the published
# one and pull it instead of the (commented) Never policy.
- name: "agent_sandbox | install | Apply sandbox-router manifest"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ agent_sandbox_namespace }}"
    definition: >-
      {{ _agent_sandbox_router_manifest.content
         | replace('${ROUTER_IMAGE}', agent_sandbox_router_image)
         | replace('imagePullPolicy: Never', 'imagePullPolicy: IfNotPresent')
         | from_yaml_all | list }}

- name: "agent_sandbox | install | Inject ROUTER_AUTH_TOKEN into sandbox-router"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: sandbox-router-deployment
        namespace: "{{ agent_sandbox_namespace }}"
      spec:
        template:
          spec:
            containers:
              - name: router
                env:
                  - name: ROUTER_AUTH_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: sandbox-router-auth
                        key: ROUTER_AUTH_TOKEN

- name: "agent_sandbox | install | Wait for sandbox-router"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: sandbox-router-deployment
    namespace: "{{ agent_sandbox_namespace }}"
    wait: true
    wait_timeout: 600
  check_mode: false

# ── Default python template and warm pool ─────────────────────────────────────

- name: "agent_sandbox | install | Apply python SandboxTemplate"
  kubernetes.core.k8s:
    state: present
    template: python-sandbox-template.yaml.j2

- name: "agent_sandbox | install | Apply python SandboxWarmPool"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: extensions.agents.x-k8s.io/v1beta1
      kind: SandboxWarmPool
      metadata:
        name: "{{ agent_sandbox_python_warm_pool_name }}"
        namespace: "{{ agent_sandbox_namespace }}"
        labels:
          app: "{{ agent_sandbox_python_warm_pool_name }}"
      spec:
        replicas: "{{ agent_sandbox_python_warm_pool_size | int }}"
        sandboxTemplateRef:
          name: python-sandbox-template
  when: (agent_sandbox_python_warm_pool_size | int) > 0

# ── Kata template and warm pool (kata_containers) ─────────────────────────────

- name: "agent_sandbox | install | Read Kata RuntimeClasses"
  kubernetes.core.k8s_info:
    api_version: node.k8s.io/v1
    kind: RuntimeClass
  register: _agent_sandbox_runtime_classes
  check_mode: false
  when: kata_containers_enabled | default(false) | bool  # Foreign: owned by kata_containers

# kata-fc (Firecracker) when kata-deploy created it, else kata-qemu, else none.
- name: "agent_sandbox | install | Select Kata RuntimeClass"
  ansible.builtin.set_fact:
    _agent_sandbox_kata_runtime_class: >-
      {{ [_agent_sandbox_kata_fc, _agent_sandbox_kata_qemu]
         | select('in', _agent_sandbox_runtime_classes.resources | default([]) | map(attribute='metadata.name') | list)
         | first | default('') }}
  vars:
    # Foreign: owned by kata_containers
    _agent_sandbox_kata_fc: "{{ kata_fc_runtime_class | default('kata-fc') }}"
    _agent_sandbox_kata_qemu: "{{ kata_qemu_runtime_class | default('kata-qemu') }}"

- name: "agent_sandbox | install | Report missing Kata RuntimeClass"
  ansible.builtin.debug:
    msg: >-
      kata_containers_enabled is true but neither '{{ kata_fc_runtime_class | default('kata-fc') }}' nor
      '{{ kata_qemu_runtime_class | default('kata-qemu') }}' RuntimeClass exists (see the kata_containers
      component output). Skipping the Kata SandboxTemplate and warm pool.
  when:
    - kata_containers_enabled | default(false) | bool  # Foreign: owned by kata_containers
    - _agent_sandbox_kata_runtime_class | length == 0

- name: "agent_sandbox | install | Apply Kata template and warm pool"
  when: _agent_sandbox_kata_runtime_class | length > 0
  block:
    - name: "agent_sandbox | install | Apply Kata SandboxTemplate"
      kubernetes.core.k8s:
        state: present
        template: kata-sandbox-template.yaml.j2
      vars:
        # Foreign: owned by kata_containers
        _agent_sandbox_kata_node_label_key: "{{ kata_node_label_key | default('ei-kata-eligible') }}"
        _agent_sandbox_kata_node_label_value: "{{ kata_node_label_value | default('true') }}"

    # No readiness gate on the pool: a per-node virtualisation problem must not
    # hang the stack deployment.
    - name: "agent_sandbox | install | Apply Kata SandboxWarmPool"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: extensions.agents.x-k8s.io/v1beta1
          kind: SandboxWarmPool
          metadata:
            name: "{{ kata_warm_pool_name }}"
            namespace: "{{ agent_sandbox_namespace }}"
            labels:
              app: "{{ kata_warm_pool_name }}"
          spec:
            replicas: "{{ kata_warm_pool_size | int }}"
            sandboxTemplateRef:
              name: "{{ kata_sandbox_template_name }}"
      when: (kata_warm_pool_size | int) > 0

- name: "agent_sandbox | install | Show connection details"
  ansible.builtin.debug:
    msg:
      - "Version: {{ agent_sandbox_version }}"
      - "Router: http://sandbox-router-svc.{{ agent_sandbox_namespace }}.svc.cluster.local:8080"
      - "WarmPool: {{ agent_sandbox_python_warm_pool_name }} (size={{ agent_sandbox_python_warm_pool_size }})"
      - >-
        Kata: {{ (kata_sandbox_template_name ~ ' (runtimeClassName=' ~ _agent_sandbox_kata_runtime_class ~ '), pool '
                  ~ kata_warm_pool_name ~ ' (size=' ~ kata_warm_pool_size ~ ')')
                 if _agent_sandbox_kata_runtime_class | length > 0 else 'not deployed' }}
