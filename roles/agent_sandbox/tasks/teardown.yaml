---
# =============================================================================
# agent_sandbox | teardown
# =============================================================================
# Removes the sandbox-router, the release manifests (controller and CRDs, which
# also removes every Sandbox, template and warm pool) and the namespace. Runs
# after openshell, which depends on these CRDs. A no-op when nothing is present.
# =============================================================================

- name: "agent_sandbox | teardown | Remove sandbox-router deployment"
  kubernetes.core.k8s:
    state: absent
    api_version: apps/v1
    kind: Deployment
    name: sandbox-router-deployment
    namespace: "{{ agent_sandbox_namespace }}"

- name: "agent_sandbox | teardown | Remove release manifests"
  kubernetes.core.k8s:
    state: absent
    src: "{{ item }}"
  loop:
    - "{{ agent_sandbox_extensions_manifest_url }}"
    - "{{ agent_sandbox_core_manifest_url }}"

- name: "agent_sandbox | teardown | Remove namespace"
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Namespace
    name: "{{ agent_sandbox_namespace }}"
    wait: true
