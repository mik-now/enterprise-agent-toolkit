---
# =============================================================================
# agent_sandbox | validate
# =============================================================================
# Read-only. Asserts the controller and router are available, the Sandbox API
# is served and the templates exist. A warm pool with no ready sandboxes is
# reported as PENDING, not as a failure.
# =============================================================================

- name: "agent_sandbox | validate | Read deployments"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item }}"
    namespace: "{{ agent_sandbox_namespace }}"
  loop: [agent-sandbox-controller, sandbox-router-deployment]
  register: _agent_sandbox_deployments
  check_mode: false

- name: "agent_sandbox | validate | Assert deployments are available"
  ansible.builtin.assert:
    that:
      - item.resources | length > 0
      - item.resources[0].status.conditions | default([])
        | selectattr('type', 'eq', 'Available') | selectattr('status', 'eq', 'True') | list | length > 0
    fail_msg: "Deployment {{ item.item }} in {{ agent_sandbox_namespace }} is missing or not Available"
    quiet: true
  loop: "{{ _agent_sandbox_deployments.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: "agent_sandbox | validate | Read Sandbox CRD"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: sandboxes.agents.x-k8s.io
  register: _agent_sandbox_crd
  check_mode: false

- name: "agent_sandbox | validate | Read SandboxTemplates"
  kubernetes.core.k8s_info:
    api_version: extensions.agents.x-k8s.io/v1beta1
    kind: SandboxTemplate
    namespace: "{{ agent_sandbox_namespace }}"
  register: _agent_sandbox_templates
  check_mode: false

# Install applies the Kata template only when kata-deploy created a Kata RuntimeClass.
- name: "agent_sandbox | validate | Read Kata RuntimeClasses"
  kubernetes.core.k8s_info:
    api_version: node.k8s.io/v1
    kind: RuntimeClass
  register: _agent_sandbox_runtime_classes
  check_mode: false
  when: kata_containers_enabled | default(false) | bool  # Foreign: owned by kata_containers

- name: "agent_sandbox | validate | Assert Sandbox API and templates"
  ansible.builtin.assert:
    that:
      - _agent_sandbox_crd.resources | length > 0
      - "'python-sandbox-template' in _agent_sandbox_template_names"
      - not (_agent_sandbox_kata_expected | bool) or kata_sandbox_template_name in _agent_sandbox_template_names
    fail_msg: >-
      Sandbox API or templates missing in {{ agent_sandbox_namespace }}
      (CRD sandboxes.agents.x-k8s.io: {{ 'ok' if _agent_sandbox_crd.resources | length > 0 else 'missing' }},
      templates: {{ _agent_sandbox_template_names | join(', ') or 'none' }})
    quiet: true
  vars:
    _agent_sandbox_template_names: "{{ _agent_sandbox_templates.resources | map(attribute='metadata.name') | list }}"
    _agent_sandbox_kata_expected: >-
      {{ _agent_sandbox_runtime_classes.resources | default([]) | map(attribute='metadata.name')
         | select('in', [kata_fc_runtime_class | default('kata-fc'), kata_qemu_runtime_class | default('kata-qemu')])
         | list | length > 0 }}

- name: "agent_sandbox | validate | Read SandboxWarmPools"
  kubernetes.core.k8s_info:
    api_version: extensions.agents.x-k8s.io/v1beta1
    kind: SandboxWarmPool
    namespace: "{{ agent_sandbox_namespace }}"
  register: _agent_sandbox_warm_pools
  check_mode: false

- name: "agent_sandbox | validate | Report warm pools with no ready sandboxes"
  ansible.builtin.debug:
    msg: >-
      PENDING: SandboxWarmPool '{{ item.metadata.name }}' has
      {{ item.status.readyReplicas | default(0) }}/{{ item.spec.replicas | default(0) }} ready sandboxes.
      Check kubectl get pods -n {{ agent_sandbox_namespace }} and the controller logs.
  loop: "{{ _agent_sandbox_warm_pools.resources }}"
  loop_control:
    label: "{{ item.metadata.name }}"
  when: (item.spec.replicas | default(0) | int) > 0 and (item.status.readyReplicas | default(0) | int) == 0
