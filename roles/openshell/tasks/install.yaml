---
# =============================================================================
# openshell | install
# =============================================================================
# Installs or upgrades the OpenShell gateway (Helm) on top of agent_sandbox,
# replicates the client TLS secret the chart leaves out, applies the sandbox
# NetworkPolicy and, when the inference LiteLLM is deployed (auth_type
# litellm_vkey or litellm_enabled), registers the GenAI Gateway provider with
# a per-deployment LiteLLM virtual key through the openshell CLI.
# =============================================================================

# ── Prerequisites ─────────────────────────────────────────────────────────────

- name: "openshell | install | Require an explicit user-authentication mode"
  ansible.builtin.assert:
    that: openshell_oidc_issuer | length > 0 or openshell_allow_unauthenticated_clusterip_only | bool
    fail_msg: >-
      OpenShell on Kubernetes authenticates users via OIDC only. Set openshell_oidc_issuer
      (e.g. a Keycloak realm URL) or openshell_allow_unauthenticated_clusterip_only=true
      to accept single-admin access gated by Kubernetes RBAC (port-forward).
    quiet: true

- name: "openshell | install | Read Agent Sandbox CRD"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: sandboxes.agents.x-k8s.io
  register: _openshell_sandbox_crd
  check_mode: false

- name: "openshell | install | Assert Agent Sandbox API is served"
  ansible.builtin.assert:
    that:
      - _openshell_sandbox_crd.resources | length > 0
      - "'v1beta1' in _openshell_sandbox_crd.resources[0].spec.versions | map(attribute='name') | list"
    fail_msg: "OpenShell needs the agents.x-k8s.io/v1beta1 Sandbox API: install agent_sandbox first."
    quiet: true

# ── Gateway ───────────────────────────────────────────────────────────────────

- name: "openshell | install | Create namespaces"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ item }}"
  loop:
    - "{{ openshell_namespace }}"
    - "{{ openshell_sandbox_namespace }}"

# The chart overlay and the role settings go in as one values dict: an unchanged
# release then compares equal to it and is not upgraded again.
- name: "openshell | install | Install gateway chart"
  kubernetes.core.helm:
    name: "{{ openshell_release_name }}"
    chart_ref: "{{ openshell_chart_ref }}"
    chart_version: "{{ openshell_chart_version }}"
    release_namespace: "{{ openshell_namespace }}"
    values: >-
      {{ lookup('ansible.builtin.file', helm_charts_base_openshell ~ '/values.yaml') | from_yaml
         | combine(_openshell_helm_overrides | from_yaml, recursive=True) }}
    wait: "{{ helm_wait }}"
    timeout: "{{ helm_timeout }}"
  vars:
    _openshell_helm_overrides: |
      global:
        image:
          tag: {{ openshell_image_tag | to_json }}
      {% if openshell_image_tag == 'dev' %}
          pullPolicy: Always
      {% endif %}
      server:
        sandboxNamespace: {{ openshell_sandbox_namespace | to_json }}
      {% if openshell_oidc_issuer | length > 0 %}
        oidc:
          issuer: {{ openshell_oidc_issuer | to_json }}
          audience: {{ openshell_oidc_audience | to_json }}
      {% else %}
        auth:
          allowUnauthenticatedUsers: true
      {% endif %}
      {% if openshell_upstream_proxy | length > 0 %}
      upstreamProxy:
        url: {{ openshell_upstream_proxy | to_json }}
        noProxy: {{ openshell_upstream_no_proxy | to_json }}
      {% endif %}
  register: _openshell_helm
  retries: "{{ helm_retries }}"
  delay: 15
  until: _openshell_helm is succeeded

- name: "openshell | install | Read client TLS secret"
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ openshell_client_tls_secret }}"
    namespace: "{{ openshell_namespace }}"
  register: _openshell_client_tls
  check_mode: false
  no_log: "{{ secure_logs | default(true) | bool }}"

# Chart gap: supervisor pods in server.sandboxNamespace mount the client TLS secret,
# but the chart only creates it in the release namespace.
- name: "openshell | install | Replicate client TLS secret into the sandbox namespace"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ openshell_client_tls_secret }}"
        namespace: "{{ openshell_sandbox_namespace }}"
      type: "{{ _openshell_client_tls.resources[0].type }}"
      data: "{{ _openshell_client_tls.resources[0].data }}"
  no_log: "{{ secure_logs | default(true) | bool }}"

# NodeLocal DNSCache is the pods' resolver on a link-local address that the kube-dns
# pod selector does not match. Its DaemonSet is nodelocaldns on kubespray clusters and
# node-local-dns with the upstream manifest. When neither exists, only the kube-dns
# pods are allowed (openshell_sandbox_dns_cidrs names another resolver).
- name: "openshell | install | Read NodeLocal DNSCache DaemonSets"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: DaemonSet
    name: "{{ item }}"
    namespace: kube-system
  loop: [nodelocaldns, node-local-dns]
  register: _openshell_nodelocaldns
  check_mode: false
  when:
    - openshell_sandbox_network_policy | bool
    - openshell_sandbox_dns_cidrs | length == 0

- name: "openshell | install | Apply sandbox pod NetworkPolicy"
  kubernetes.core.k8s:
    state: present
    template: sandbox-networkpolicy.yaml.j2
  vars:
    # Proxy hostnames behind GSLB resolve to varying IPs: allow the proxy port on
    # openshell_upstream_proxy_cidrs (default: private ranges) instead of pinning /32s.
    _openshell_proxy_cidrs: "{{ openshell_upstream_proxy_cidrs if openshell_upstream_proxy | length > 0 else [] }}"
    # NodeLocal DNSCache container args, e.g. [-localip, <address>, -conf, ...].
    _openshell_nodelocaldns_args: >-
      {{ _openshell_nodelocaldns.results | default([])
         | map(attribute='resources', default=[]) | flatten
         | map(attribute='spec.template.spec.containers') | flatten
         | map(attribute='args', default=[]) | flatten }}
    # Each -localip may list several comma-separated addresses.
    _openshell_nodelocaldns_cidrs: >-
      {{ (_openshell_nodelocaldns_args | zip(_openshell_nodelocaldns_args[1:])
          | selectattr(0, 'eq', '-localip') | map(attribute=1) | join(','))
         | split(',') | map('trim') | select | unique | map('regex_replace', '$', '/32') | list }}
    _openshell_dns_cidrs: >-
      {{ openshell_sandbox_dns_cidrs if openshell_sandbox_dns_cidrs | length > 0
         else _openshell_nodelocaldns_cidrs }}
  when: openshell_sandbox_network_policy | bool

- name: "openshell | install | Wait for gateway"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: "{{ openshell_release_name }}"
    namespace: "{{ openshell_namespace }}"
    wait: true
    wait_timeout: 300
  check_mode: false

# ── GenAI Gateway provider (per-deployment LiteLLM virtual key) ───────────────

- name: "openshell | install | Read GenAI Gateway deployment"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ openshell_genai_deployment }}"
    namespace: "{{ openshell_genai_namespace }}"
  register: _openshell_genai
  check_mode: false
  when: openshell_genai_provider_enabled | bool

- name: "openshell | install | Configure GenAI Gateway provider"
  when:
    - openshell_genai_provider_enabled | bool
    - _openshell_genai.resources | length > 0
  vars:
    _openshell_cli: "{{ _openshell_cli_path }}/openshell"
    _openshell_mtls_dir: "{{ _openshell_cli_path }}/config/openshell/gateways/eat/mtls"
  block:
    # The mesh-wide PeerAuthentication is STRICT and the LiteLLM namespace is ambient,
    # so plaintext from the (non-mesh) sandbox supervisor is rejected. Accept it on the
    # LiteLLM pods only, as envoy_gateway does for the edge (eg-gateway-edge); LiteLLM
    # still requires the virtual key. LiteLLM's ingress AuthorizationPolicy admits the
    # sandboxes from the pod network (litellm_allow_pod_network, set in config.yaml).
    - name: "openshell | install | Let sandboxes reach LiteLLM under STRICT mTLS"
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: security.istio.io/v1
          kind: PeerAuthentication
          metadata:
            name: openshell-sandbox-ingress
            namespace: "{{ openshell_genai_namespace }}"
            labels:
              app.kubernetes.io/managed-by: agentic-ai-stack
          spec:
            selector:
              matchLabels: {app.kubernetes.io/name: "{{ openshell_genai_deployment }}"}
            mtls:
              mode: PERMISSIVE
      when: istio_enabled | default(false) | bool  # Foreign: owned by istio

    - name: "openshell | install | Read LiteLLM virtual key secret"
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: openshell-genai-key
        namespace: "{{ openshell_namespace }}"
      register: _openshell_genai_key
      check_mode: false
      no_log: "{{ secure_logs | default(true) | bool }}"

    - name: "openshell | install | Mint LiteLLM virtual key"
      when: _openshell_genai_key.resources | length == 0
      block:
        - name: "openshell | install | Read LiteLLM pods"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Pod
            namespace: "{{ openshell_genai_namespace }}"
            label_selectors: >-
              {{ _openshell_genai_selector.keys() | zip(_openshell_genai_selector.values())
                 | map('join', '=') | list }}
            field_selectors:
              - status.phase=Running
          vars:
            _openshell_genai_selector: "{{ _openshell_genai.resources[0].spec.selector.matchLabels }}"
          register: _openshell_genai_pods
          check_mode: false

        # Minted inside the LiteLLM pod so the master key never leaves it.
        - name: "openshell | install | Mint virtual key in the LiteLLM pod"
          kubernetes.core.k8s_exec:
            namespace: "{{ openshell_genai_namespace }}"
            pod: "{{ _openshell_genai_pods.resources[0].metadata.name }}"
            container: litellm
            command: "python -c {{ _openshell_mint_script | quote }}"
          vars:
            _openshell_mint_script: |
              import json, os, urllib.request
              body = {"key_alias": {{ openshell_genai_key_alias | to_json }},
                      "models": {{ openshell_genai_key_models | to_json }},
                      "max_budget": {{ openshell_genai_key_max_budget | to_json }}}
              req = urllib.request.Request("http://127.0.0.1:4000/key/generate", json.dumps(body).encode(),
                  {"Authorization": "Bearer " + os.environ["PROXY_MASTER_KEY"], "Content-Type": "application/json"})
              print(json.load(urllib.request.urlopen(req))["key"])
          register: _openshell_genai_mint
          no_log: "{{ secure_logs | default(true) | bool }}"

        - name: "openshell | install | Store LiteLLM virtual key"
          kubernetes.core.k8s:
            state: present
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: openshell-genai-key
                namespace: "{{ openshell_namespace }}"
              type: Opaque
              stringData:
                api_key: "{{ _openshell_genai_mint.stdout | trim }}"
          no_log: "{{ secure_logs | default(true) | bool }}"

    # The CLI runs on the installer host (localhost), so its HOME is the controller's.
    - name: "openshell | install | Set CLI directory"
      ansible.builtin.set_fact:
        _openshell_cli_path: >-
          {{ openshell_cli_dir if openshell_cli_dir | length > 0
             else lookup('ansible.builtin.env', 'HOME') ~ '/.cache/eat/openshell-cli-' ~ openshell_release_tag }}

    # Private before anything is extracted or run from it; fails if another user owns it.
    - name: "openshell | install | Prepare CLI directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - "{{ _openshell_cli_path }}"
        - "{{ _openshell_mtls_dir }}"

    - name: "openshell | install | Fetch OpenShell CLI"
      ansible.builtin.unarchive:
        src: "{{ openshell_cli_url }}"
        dest: "{{ _openshell_cli_path }}"
        remote_src: true
        creates: "{{ _openshell_cli_path }}/openshell"

    # Transient: the always section below removes the whole CLI config again.
    - name: "openshell | install | Write CLI mTLS bundle"
      ansible.builtin.copy:
        content: "{{ _openshell_client_tls.resources[0].data[item] | b64decode }}"
        dest: "{{ _openshell_mtls_dir }}/{{ item }}"
        mode: "0600"
      loop: [ca.crt, tls.crt, tls.key]
      changed_when: false
      no_log: "{{ secure_logs | default(true) | bool }}"

    # raw: the CLI reaches the ClusterIP-only gateway only through a local port-forward,
    # which has to outlive this task; the always section stops it.
    - name: "openshell | install | Start gateway port-forward"
      ansible.builtin.shell: |
        set -euo pipefail
        nohup kubectl port-forward -n {{ openshell_namespace | quote }} \
          svc/{{ openshell_release_name | quote }} 0:8080 > config/port-forward.log 2>&1 < /dev/null &
        echo $!
      args:
        executable: /bin/bash
        chdir: "{{ _openshell_cli_path }}"
      environment: "{{ openshell_cli_env | combine({'KUBECONFIG': _openshell_kubeconfig}) }}"
      vars:
        _openshell_kubeconfig: "{{ kubernetes_kubeconfig | default(lookup('ansible.builtin.env', 'KUBECONFIG')) }}"
      register: _openshell_port_forward
      changed_when: false

    - name: "openshell | install | Wait for port-forward"
      block:
        - name: "openshell | install | Read port-forward port"
          ansible.builtin.wait_for:
            path: "{{ _openshell_cli_path }}/config/port-forward.log"
            search_regex: 'Forwarding from 127\.0\.0\.1:([0-9]+)'
            timeout: 30
          register: _openshell_port_forward_ready
      rescue:
        - name: "openshell | install | Read port-forward log"
          ansible.builtin.slurp:
            src: "{{ _openshell_cli_path }}/config/port-forward.log"
          register: _openshell_port_forward_log

        - name: "openshell | install | Report port-forward failure"
          ansible.builtin.fail:
            msg: >-
              port-forward to svc/{{ openshell_release_name }} did not start:
              {{ _openshell_port_forward_log.content | b64decode }}

    # Writes the transient CLI config only.
    - name: "openshell | install | Register gateway with the CLI"
      ansible.builtin.command:
        argv:
          - "{{ _openshell_cli }}"
          - gateway
          - add
          - "https://127.0.0.1:{{ _openshell_port_forward_ready.match_groups[0] }}"
          - --local
          - --name
          - eat
      environment: "{{ openshell_cli_env }}"
      changed_when: false

    - name: "openshell | install | Read gateway settings"
      ansible.builtin.command:
        argv: ["{{ _openshell_cli }}", settings, get, --global]
      environment: "{{ openshell_cli_env }}"
      register: _openshell_settings
      changed_when: false
      check_mode: false

    # <= 0.0.116 composes provider endpoints into sandbox policy only behind this flag
    # (dev builds dropped the key and always compose). Setting it again is a no-op,
    # and the CLI does not say whether it changed.
    - name: "openshell | install | Enable providers v2"
      ansible.builtin.command:
        argv: ["{{ _openshell_cli }}", settings, set, --global, --key, providers_v2_enabled, --value, "true", --yes]
      environment: "{{ openshell_cli_env }}"
      changed_when: false
      when: "'providers_v2_enabled' in _openshell_settings.stdout"

    # Match the gRPC NotFound text: the CLI line-wraps the "provider profile not found" message.
    - name: "openshell | install | Read provider profile"
      ansible.builtin.command:
        argv: ["{{ _openshell_cli }}", provider, profile, export, eat-genai-gateway]
      environment: "{{ openshell_cli_env }}"
      register: _openshell_profile
      until: >-
        _openshell_profile.rc == 0
        or 'entity was not found' in (_openshell_profile.stdout ~ _openshell_profile.stderr)
      retries: 3
      delay: 2
      changed_when: false
      failed_when:
        - _openshell_profile.rc != 0
        - "'entity was not found' not in (_openshell_profile.stdout ~ _openshell_profile.stderr)"
      check_mode: false

    - name: "openshell | install | Resolve provider profile state"
      ansible.builtin.set_fact:
        _openshell_profile_found: "{{ _openshell_profile.rc == 0 }}"
        _openshell_profile_resource_version: >-
          {{ _openshell_profile.stdout | regex_findall('(?m)^resource_version: *([0-9]+)') | first | default('') }}

    # The last applied profile is kept beside the CLI: a dry run against it tells
    # whether the gateway copy needs an update.
    - name: "openshell | install | Compare provider profile with the last applied one"
      ansible.builtin.template:
        src: genai-gateway-provider.yaml.j2
        dest: "{{ _openshell_cli_path }}/genai-gateway-provider.yaml"
        mode: "0644"
      vars:
        _openshell_profile_resource_version: ""
      check_mode: true
      register: _openshell_profile_drift

    - name: "openshell | install | Apply provider profile"
      when: not (_openshell_profile_found | bool) or _openshell_profile_drift is changed
      block:
        # update is optimistic-concurrency: the file carries the stored resource_version.
        - name: "openshell | install | Render provider profile for the gateway"
          ansible.builtin.template:
            src: genai-gateway-provider.yaml.j2
            dest: "{{ _openshell_cli_path }}/config/genai-gateway-provider.yaml"
            mode: "0600"
          changed_when: false

        - name: "openshell | install | Update provider profile"
          ansible.builtin.command:
            argv:
              - "{{ _openshell_cli }}"
              - provider
              - profile
              - update
              - --file
              - "{{ _openshell_cli_path }}/config/genai-gateway-provider.yaml"
              - eat-genai-gateway
          environment: "{{ openshell_cli_env }}"
          changed_when: true
          when: _openshell_profile_found | bool

        - name: "openshell | install | Import provider profile"
          ansible.builtin.command:
            argv:
              - "{{ _openshell_cli }}"
              - provider
              - profile
              - import
              - -f
              - "{{ _openshell_cli_path }}/config/genai-gateway-provider.yaml"
          environment: "{{ openshell_cli_env }}"
          changed_when: true
          when: not (_openshell_profile_found | bool)

        - name: "openshell | install | Record applied provider profile"
          ansible.builtin.template:
            src: genai-gateway-provider.yaml.j2
            dest: "{{ _openshell_cli_path }}/genai-gateway-provider.yaml"
            mode: "0644"
          vars:
            _openshell_profile_resource_version: ""

    - name: "openshell | install | Read provider"
      ansible.builtin.command:
        argv: ["{{ _openshell_cli }}", provider, get, "{{ openshell_genai_provider_name }}"]
      environment: "{{ openshell_cli_env }}"
      register: _openshell_provider
      changed_when: false
      failed_when: false
      check_mode: false

    - name: "openshell | install | Create provider"
      when: _openshell_provider.rc != 0
      block:
        - name: "openshell | install | Read LiteLLM virtual key"
          kubernetes.core.k8s_info:
            api_version: v1
            kind: Secret
            name: openshell-genai-key
            namespace: "{{ openshell_namespace }}"
          register: _openshell_genai_key
          check_mode: false
          no_log: "{{ secure_logs | default(true) | bool }}"

        # A transient get failure above must not fail a re-run: "already exists" is success.
        - name: "openshell | install | Create provider with the virtual key"
          ansible.builtin.command:
            argv:
              - "{{ _openshell_cli }}"
              - provider
              - create
              - --name
              - "{{ openshell_genai_provider_name }}"
              - --type
              - eat-genai-gateway
              - --credential
              - OPENAI_API_KEY
          environment: "{{ openshell_cli_env | combine({'OPENAI_API_KEY': _openshell_genai_api_key}) }}"
          vars:
            _openshell_genai_api_key: "{{ _openshell_genai_key.resources[0].data.api_key | b64decode }}"
          register: _openshell_provider_create
          changed_when: _openshell_provider_create.rc == 0
          failed_when:
            - _openshell_provider_create.rc != 0
            - "'already exists' not in (_openshell_provider_create.stdout ~ _openshell_provider_create.stderr)"
          no_log: "{{ secure_logs | default(true) | bool }}"

  always:
    - name: "openshell | install | Stop gateway port-forward"
      ansible.builtin.command:
        argv: [kill, "{{ _openshell_port_forward.stdout | trim }}"]
      register: _openshell_port_forward_kill
      changed_when: false
      failed_when:
        - _openshell_port_forward_kill.rc != 0
        - "'No such process' not in _openshell_port_forward_kill.stderr"
      when: _openshell_port_forward.stdout | default('') | trim | length > 0

    - name: "openshell | install | Remove CLI credentials"
      ansible.builtin.file:
        path: "{{ _openshell_cli_path }}/config"
        state: absent
      when: _openshell_cli_path is defined

# ── Summary ───────────────────────────────────────────────────────────────────

- name: "openshell | install | Show access details"
  ansible.builtin.debug:
    msg:
      - "Chart      : {{ openshell_chart_ref }}:{{ openshell_chart_version }} (images {{ openshell_image_tag }})"
      - "Gateway    : {{ openshell_release_name }}.{{ openshell_namespace }}.svc.cluster.local:8080 (mTLS)"
      - "Sandboxes  : namespace {{ openshell_sandbox_namespace }} (Agent Sandbox CRs)"
      - >-
        Auth       : {{ 'OIDC ' ~ openshell_oidc_issuer if openshell_oidc_issuer | length > 0
                        else 'ClusterIP-only, Kubernetes RBAC (port-forward)' }}
      - >-
        Provider   : {{ openshell_genai_provider_name if _openshell_genai.resources | default([]) | length > 0
                        else 'none (GenAI Gateway not deployed)' }}
      - "Quick-start (admin):"
      - "  kubectl port-forward -n {{ openshell_namespace }} svc/{{ openshell_release_name }} 8080:8080 &"
      - "  # client mTLS bundle: secret {{ openshell_client_tls_secret }} in {{ openshell_namespace }}"
      - "  openshell gateway add https://127.0.0.1:8080 --local --name eat"
      - "  openshell sandbox create --name demo --provider {{ openshell_genai_provider_name }} \\"
      - "    --env OPENAI_BASE_URL=http://{{ openshell_genai_service_host }}:{{ openshell_genai_service_port }}/v1"
