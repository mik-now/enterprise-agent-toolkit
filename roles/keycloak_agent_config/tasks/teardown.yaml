# =============================================================================
# keycloak_agent_config | teardown
# =============================================================================
# Removes the KeycloakRealmImport. The Keycloak operator does not delete an
# imported realm, so the realm itself stays in Keycloak. A no-op when Keycloak
# (its CRD) or the import is absent.
# =============================================================================

- name: "keycloak_agent_config | teardown | Read KeycloakRealmImport CRD"
  kubernetes.core.k8s_info:
    api_version: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    name: keycloakrealmimports.k8s.keycloak.org
  register: _keycloak_agent_config_crd
  check_mode: false

- name: "keycloak_agent_config | teardown | Remove KeycloakRealmImport"
  kubernetes.core.k8s:
    state: absent
    api_version: k8s.keycloak.org/v2beta1
    kind: KeycloakRealmImport
    name: "{{ keycloak_agent_realm }}"
    namespace: "{{ keycloak_namespace | default('keycloak') }}"  # Foreign: owned by keycloak
  when: _keycloak_agent_config_crd.resources | length > 0
