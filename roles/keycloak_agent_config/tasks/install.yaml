---
# =============================================================================
# keycloak_agent_config | install
# =============================================================================
# Applies the KeycloakRealmImport for the agent-toolkit realm on the platform
# Keycloak and waits for the operator to import it. A changed spec is applied
# and re-imported by the operator.
# =============================================================================

- name: "keycloak_agent_config | install | Wait for Keycloak to be ready"
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: StatefulSet
    name: keycloak
    namespace: "{{ keycloak_namespace | default('keycloak') }}"  # Foreign: owned by keycloak
  register: _keycloak_agent_config_sts
  until:
    - _keycloak_agent_config_sts.resources | length > 0
    - (_keycloak_agent_config_sts.resources[0].status.readyReplicas | default(0) | int) > 0
  retries: 60
  delay: 5
  check_mode: false

- name: "keycloak_agent_config | install | Apply KeycloakRealmImport"
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: k8s.keycloak.org/v2beta1
      kind: KeycloakRealmImport
      metadata:
        name: "{{ keycloak_agent_realm }}"
        namespace: "{{ keycloak_namespace | default('keycloak') }}"  # Foreign: owned by keycloak
      spec:
        keycloakCRName: keycloak
        realm:
          realm: "{{ keycloak_agent_realm }}"
          enabled: true
          clients:
            - clientId: "{{ keycloak_agent_client_id }}"
              enabled: true
              protocol: openid-connect
              publicClient: true
              directAccessGrantsEnabled: true
              standardFlowEnabled: true
              attributes:
                # CRD requires client attribute values to be strings, not ints.
                access.token.lifespan: "{{ keycloak_agent_token_lifespan | string }}"

- name: "keycloak_agent_config | install | Wait for realm import to finish"
  kubernetes.core.k8s_info:
    api_version: k8s.keycloak.org/v2beta1
    kind: KeycloakRealmImport
    name: "{{ keycloak_agent_realm }}"
    namespace: "{{ keycloak_namespace | default('keycloak') }}"  # Foreign: owned by keycloak
  register: _keycloak_agent_config_import
  vars:
    _keycloak_agent_config_conditions: >-
      {{ (_keycloak_agent_config_import.resources | first | default({})).status.conditions | default([])
         | selectattr('status', 'eq', 'True') | map(attribute='type') | list }}
  until: "'Done' in _keycloak_agent_config_conditions or 'HasErrors' in _keycloak_agent_config_conditions"
  retries: 30
  delay: 5
  check_mode: false

- name: "keycloak_agent_config | install | Assert realm import succeeded"
  ansible.builtin.assert:
    that: "'HasErrors' not in _keycloak_agent_config_conditions"
    fail_msg: >-
      KeycloakRealmImport {{ keycloak_agent_realm }} has errors:
      {{ (_keycloak_agent_config_import.resources[0].status.conditions | default([])
          | selectattr('type', 'eq', 'HasErrors') | map(attribute='message') | join('; ')) }}
    quiet: true
  vars:
    _keycloak_agent_config_conditions: >-
      {{ _keycloak_agent_config_import.resources[0].status.conditions | default([])
         | selectattr('status', 'eq', 'True') | map(attribute='type') | list }}
