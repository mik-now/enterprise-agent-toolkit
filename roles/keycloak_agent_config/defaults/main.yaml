# =============================================================================
# keycloak_agent_config | defaults
# =============================================================================
# Creates the agent-toolkit realm and client on the platform Keycloak through a
# KeycloakRealmImport. Does not deploy Keycloak: the platform keycloak role
# does, and its keycloak_namespace is read as a foreign variable.
# =============================================================================

# ── Behaviour ─────────────────────────────────────────────────────────────────
keycloak_agent_realm: "agent-toolkit"            # realm (and KeycloakRealmImport) name
keycloak_agent_client_id: "agent-toolkit-client" # public OIDC client of the realm
keycloak_agent_token_lifespan: 900               # access token lifespan, seconds
